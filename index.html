<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Formy vlády: prezidencialismus</title>
<meta name="description" content="Vzdělávací rozhodovací hra pro střední školy: Jaké jsou výhody a rizika prezidentského systému?">
<!-- Písma úvodního videa (volitelná: offline se použijí systémová písma, hra funguje i bez nich) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap" rel="stylesheet">
<!--
  ================================================================
  FORMY VLÁDY: PREZIDENCIALISMUS  (vzdělávací rozhodovací hra)
  ================================================================
  Jeden soubor, žádné závislosti, žádný build. Funguje offline.

  JAK UPRAVIT OBSAH (bez zásahu do logiky):
  - Všechny texty jsou v bloku <script id="data"> níže, v pořadí:
      GLOSSARY   = slovníček (pole objektů {id, pojem, kratce, dlouze, priklad, jadro})
      PRIMER     = panely úvodního vysvětlení (pole {nadpis, html})
      ZEME, ROLE = karty výběru
      KONCE      = čtyři možné konce
      SHRNUTI    = závěrečná tabulka výhod a rizik
      SCENARIOS  = čtyři cesty (klíč "usa-prezident", "usa-zakonodarci",
                   "latam-prezident", "latam-zakonodarci")
  - Pojmy v textech se píší jako [[id]] nebo [[id|zobrazený text]]
    (druhý tvar pro skloňování, např. [[impeachment|impeachmentem]]).
    Vykreslovač je převede na klikací prvek s popoverem ze slovníčku.
  - Každý scénář má: brief, start {dz, km}, body (3 rozhodovací body).
    Bod má buď přímo {situace, volby}, nebo "varianty" podle větve
    z předchozího bodu: {podle: true, varianty: {nazevVetve: {situace, volby}}}.
    Větev určuje pole "vetev" u volby v předchozím bodě; když chybí,
    použije se varianta "default".
  - Každá volba nese: id, text, dz, km (posun ukazatelů), dusledek,
    realita ("V realitě"), pojem {nazev, text}, proc (do debriefu),
    kontrafaktual (do debriefu), volitelně vetev, flag ("prevrat",
    "impeachment") a poznamka (zobrazí se na obrazovce konce).
  - Jak se určí konec: funkce urciKonec() v části LOGIKA. Pravidla:
      1. flag "prevrat"                         -> rozpad
      2. DZ pod prahem země (USA 20, LatAm 40)  -> rozpad
      3. KM 80 a víc                            -> rozpad
      4. flag "impeachment" a KM pod 75         -> impeachment
         (flag "impeachment" a KM 75 a víc      -> rozpad: prezident
          rozhodnutí neuznal, instituce nedržely)
      5. DZ 65 a víc                            -> stabilita
      6. jinak                                  -> pat
  - Fakta k ověření před odevzdáním: viz README.md ve stejné složce.
  ================================================================
-->
<style>
  /* ---------- Barvy a proměnné ---------- */
  :root {
    --bg: #f6f4ee;
    --bg-elev: #ffffff;
    --bg-soft: #eceae2;
    --text: #1c1b18;
    --muted: #5d5b54;
    --line: #d9d6cc;
    --accent: #1f4e79;
    --accent-ink: #ffffff;
    --term: #1f4e79;
    --focus: #e0882b;
    --green: #2e7d4f;
    --yellow: #b8860b;
    --blue: #2f5fa8;
    --red: #b3261e;
    --grey: #6b6b6b;
    --shadow: 0 2px 10px rgba(0,0,0,.08);
    --radius: 14px;
    --font-head: Georgia, "Times New Roman", "DejaVu Serif", serif;
    --font-body: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #15171b;
    --bg-elev: #1f2227;
    --bg-soft: #272a30;
    --text: #ecebe6;
    --muted: #a8a7a0;
    --line: #3a3e46;
    --accent: #8db7e8;
    --accent-ink: #0f1a26;
    --term: #9cc4f0;
    --focus: #f2a649;
    --green: #5fbf85;
    --yellow: #e0b84a;
    --blue: #7fa6e6;
    --red: #e8766d;
    --grey: #a0a0a0;
    --shadow: 0 2px 12px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b;
      --bg-elev: #1f2227;
      --bg-soft: #272a30;
      --text: #ecebe6;
      --muted: #a8a7a0;
      --line: #3a3e46;
      --accent: #8db7e8;
      --accent-ink: #0f1a26;
      --term: #9cc4f0;
      --focus: #f2a649;
      --green: #5fbf85;
      --yellow: #e0b84a;
      --blue: #7fa6e6;
      --red: #e8766d;
      --grey: #a0a0a0;
      --shadow: 0 2px 12px rgba(0,0,0,.4);
    }
  }

  /* ---------- Základ ---------- */
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  @media (min-width: 1100px) { html { font-size: 20px; } }
  @media (max-width: 480px) { html { font-size: 16px; } }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1, h2, h3 { font-family: var(--font-head); line-height: 1.2; margin: 0 0 .5em; }
  h1 { font-size: 2.2rem; }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.2rem; }
  p { margin: 0 0 .9em; }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- Hlavička ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .hdr-row {
    max-width: 1100px; margin: 0 auto; padding: .6rem 16px;
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  }
  .brand { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; margin-right: auto; background: none; border: 0; color: var(--text); cursor: pointer; padding: .2rem 0; text-align: left; }
  .hdr-actions { display: flex; gap: .4rem; }
  .btn-ghost {
    background: transparent; color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
    padding: .35rem .8rem; font: inherit; font-size: .9rem; cursor: pointer;
  }
  .btn-ghost:hover { background: var(--bg-soft); }

  /* Ukazatele v hlavičce */
  #stav {
    max-width: 1100px; margin: 0 auto; padding: .3rem 16px .7rem;
    display: grid; grid-template-columns: 1fr 1fr; gap: .8rem 1.6rem;
  }
  #stav[hidden] { display: none; }
  .meter { font-size: .85rem; }
  .meter-label { display: flex; justify-content: space-between; margin-bottom: .2rem; }
  .meter-label strong { font-weight: 600; }
  .bar { height: 12px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .bar > span { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .9s ease, background-color .9s ease; }
  .bar.dz > span { background: var(--green); }
  .bar.dz.mid > span { background: var(--yellow); }
  .bar.dz.low > span { background: var(--red); }
  .bar.km > span { background: var(--blue); }
  .bar.km.mid > span { background: var(--yellow); }
  .bar.km.high > span { background: var(--red); }
  .delta { font-weight: 700; margin-left: .4rem; }
  .delta.plus { color: var(--green); }
  .delta.minus { color: var(--red); }
  /* Mobil: kompaktní hlavička, ať přilepený panel nezabírá čtvrtinu obrazovky */
  @media (max-width: 600px) {
    .hdr-row { padding: .4rem 12px; gap: .3rem; flex-wrap: nowrap; }
    .brand { font-size: .85rem; line-height: 1.15; }
    .hdr-actions .btn-ghost { padding: .2rem .55rem; font-size: .78rem; }
    #stav { grid-template-columns: 1fr 1fr; gap: .2rem .7rem; padding: .1rem 12px .45rem; }
    .meter { font-size: .68rem; }
    .meter-label { margin-bottom: .1rem; }
    .bar { height: 8px; }
  }

  /* ---------- Obsah ---------- */
  main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 1.4rem 16px 3rem; }
  .screen[hidden] { display: none; }
  .screen { animation: fadein .35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card {
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1.2rem 1.4rem; box-shadow: var(--shadow);
    margin-bottom: 1rem;
  }
  .lead { font-size: 1.15rem; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  .kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--muted); font-weight: 700; margin-bottom: .3rem; }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
  .btn {
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; padding: .7rem 1.3rem;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  /* Karty výběru */
  .choice-card {
    text-align: left; width: 100%; height: 100%;
    background: var(--bg-elev); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 1.2rem 1.3rem; font: inherit; color: var(--text); cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .choice-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .choice-card h3 { margin-bottom: .4rem; }
  .choice-card .emoji { font-size: 2rem; display: block; margin-bottom: .3rem; }

  /* Rozhodovací volby */
  .options { display: grid; gap: .7rem; margin-top: 1rem; }
  .option {
    display: flex; gap: .8rem; align-items: flex-start; text-align: left;
    background: var(--bg-elev); border: 2px solid var(--line); border-radius: 12px;
    padding: .9rem 1rem; font: inherit; color: var(--text); cursor: pointer;
    transition: border-color .15s;
  }
  .option:hover { border-color: var(--accent); }
  .option .letter {
    flex: 0 0 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); font-weight: 700;
  }

  /* Důsledek */
  .result-box { border-left: 5px solid var(--accent); }
  .infobox { border-radius: 10px; padding: .8rem 1rem; margin: .8rem 0; background: var(--bg-soft); }
  .infobox .kicker { margin-bottom: .2rem; }
  .infobox.realita { border-left: 4px solid var(--yellow); }
  .infobox.pojem { border-left: 4px solid var(--blue); }
  .infobox.proc { border-left: 4px solid var(--green); }
  .infobox.kontra { border-left: 4px solid var(--grey); }
  .shift { display: flex; gap: 1.2rem; flex-wrap: wrap; margin: .6rem 0; font-size: .95rem; }

  /* Pojmy v textu */
  .term {
    background: none; border: 0; padding: 0; font: inherit; color: var(--term);
    text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: 3px;
    cursor: pointer;
  }
  .term:hover { text-decoration-style: solid; }
  #popover {
    position: absolute; z-index: 50; max-width: 22rem;
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: .8rem 1rem; font-size: .9rem;
  }
  #popover[hidden] { display: none; }
  #popover strong { display: block; margin-bottom: .2rem; }
  #popover .pop-actions { display: flex; justify-content: space-between; gap: .5rem; margin-top: .5rem; }
  #popover button { font: inherit; font-size: .85rem; }

  /* Slovníček (dialog) */
  dialog {
    width: min(760px, 94vw); max-height: 88vh; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--bg-elev); color: var(--text); padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.2rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-elev); }
  .dlg-body { padding: .8rem 1.2rem 1.2rem; overflow: auto; max-height: calc(88vh - 4rem); }
  .gl-section { margin: .8rem 0 .4rem; }
  details.gl { border: 1px solid var(--line); border-radius: 10px; margin: .4rem 0; background: var(--bg); }
  details.gl summary { cursor: pointer; padding: .6rem .9rem; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: .5rem; }
  details.gl summary::-webkit-details-marker { display: none; }
  details.gl summary::after { content: "+"; color: var(--muted); }
  details.gl[open] summary::after { content: "−"; }
  details.gl .gl-in { padding: 0 .9rem .8rem; font-size: .95rem; }
  details.gl .gl-in p { margin: .3em 0; }
  .tag { display: inline-block; font-size: .7rem; padding: .05rem .5rem; border-radius: 999px; background: var(--bg-soft); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .tag.core { background: var(--accent); color: var(--accent-ink); }

  /* Primer schémata */
  .schema { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin: .8rem 0; }
  @media (max-width: 700px) { .schema { grid-template-columns: 1fr; } }
  .schema .box { background: var(--bg-soft); border-radius: 10px; padding: .8rem 1rem; font-size: .95rem; }
  .schema .box h3 { margin-bottom: .4rem; }
  .flow { display: flex; flex-direction: column; gap: .3rem; align-items: stretch; }
  .flow .node { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px; padding: .4rem .7rem; text-align: center; }
  .flow .arrow { text-align: center; color: var(--muted); font-size: .9rem; }
  .triad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: .8rem 0; }
  @media (max-width: 700px) { .triad { grid-template-columns: 1fr; } }
  .triad .node { background: var(--bg-soft); border-radius: 10px; padding: .7rem; text-align: center; font-weight: 600; }
  .checks { display: grid; gap: .4rem; margin: .6rem 0; }
  .checks details { border: 1px solid var(--line); border-radius: 8px; padding: .4rem .8rem; background: var(--bg); }
  .checks summary { cursor: pointer; font-weight: 600; }
  .dots { display: flex; gap: .4rem; justify-content: center; margin: .4rem 0; }
  .dots span { width: .6rem; height: .6rem; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--accent); }
  ol.steps { padding-left: 1.3rem; }
  ol.steps li { margin-bottom: .4rem; }

  /* Konec */
  .ending { border-top: 10px solid var(--grey); }
  .ending.stabilita { border-top-color: var(--green); }
  .ending.pat { border-top-color: var(--yellow); }
  .ending.impeachment { border-top-color: var(--blue); }
  .ending.rozpad { border-top-color: var(--red); }
  .ending h1 { font-size: 2.4rem; }
  .ending-scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem; margin: .8rem 0; font-size: .8rem; text-align: center; }
  .ending-scale div { padding: .4rem .2rem; border-radius: 6px; background: var(--bg-soft); color: var(--muted); }
  .ending-scale div.on { font-weight: 700; color: var(--text); outline: 2px solid var(--accent); }
  @media (max-width: 600px) { .ending-scale { grid-template-columns: 1fr 1fr; } }
  ul.points { padding-left: 1.2rem; }
  ul.points li { margin-bottom: .4rem; }

  /* Debrief */
  .debrief-card { border-left: 6px solid var(--accent); }
  .debrief-card .step { font-family: var(--font-head); font-size: 1.1rem; color: var(--muted); }
  .debrief-card dl { margin: 0; }
  .debrief-card dt { font-weight: 700; margin-top: .6rem; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .debrief-card dd { margin: .15rem 0 0; }

  /* Shrnutí */
  table.summary { width: 100%; border-collapse: collapse; margin: .6rem 0 1rem; font-size: .95rem; }
  table.summary th, table.summary td { border: 1px solid var(--line); padding: .6rem .7rem; vertical-align: top; text-align: left; }
  table.summary th { background: var(--bg-soft); }
  table.summary td.plus { border-left: 4px solid var(--green); }
  table.summary td.minus { border-left: 4px solid var(--red); }
  @media (max-width: 700px) {
    table.summary thead { display: none; }
    table.summary tr { display: block; margin-bottom: .8rem; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    table.summary td { display: block; border: 0; border-bottom: 1px solid var(--line); }
    table.summary td::before { content: attr(data-label); display: block; font-weight: 700; font-size: .8rem; color: var(--muted); text-transform: uppercase; }
  }
  .badges { display: flex; gap: .5rem; flex-wrap: wrap; margin: .6rem 0; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: .3rem .8rem; font-size: .85rem; color: var(--muted); background: var(--bg-soft); }
  .badge.done { background: var(--green); color: #fff; border-color: transparent; }

  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; text-align: center; padding: .8rem 16px; }

  /* ---------- Postavy a scény (příběh) ---------- */
  .scene { display: flex; flex-wrap: wrap; gap: 1rem 1.2rem; align-items: flex-end; justify-content: center; margin: .6rem 0 .4rem; }
  .actor { display: flex; flex-direction: column; align-items: center; width: 11.5rem; max-width: 100%; margin: 0; text-align: center; animation: actorin .4s ease both; }
  .actor:nth-child(2) { animation-delay: .12s; } .actor:nth-child(3) { animation-delay: .24s; } .actor:nth-child(4) { animation-delay: .36s; }
  @keyframes actorin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .actor .avatar { width: 6.2rem; height: 7.4rem; }
  .actor .avatar svg { width: 100%; height: 100%; display: block; }
  .actor.hrac .avatar { filter: drop-shadow(0 0 0 transparent); }
  .actor figcaption { margin-top: .2rem; font-size: .85rem; line-height: 1.25; }
  .actor figcaption strong { display: block; }
  .actor figcaption span { color: var(--muted); }
  .actor.hrac figcaption strong::before { content: "★ "; color: var(--accent); }
  .bubble {
    position: relative; background: var(--bg-elev); border: 2px solid var(--line); border-radius: 14px;
    padding: .5rem .7rem; font-size: .92rem; line-height: 1.35; margin-bottom: .7rem; max-width: 100%;
    min-height: 2.6rem; display: flex; align-items: center; justify-content: center;
  }
  .bubble::after, .bubble::before { content: ""; position: absolute; left: 50%; transform: translateX(-50%); border: 9px solid transparent; }
  .bubble::before { bottom: -19px; border-top-color: var(--line); }
  .bubble::after { bottom: -16px; border-top-color: var(--bg-elev); }
  .actor.hrac .bubble { border-color: var(--accent); }
  .actor.hrac .bubble::before { border-top-color: var(--accent); }
  .actor.ticho .bubble { visibility: hidden; }
  .cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .8rem; margin-top: .4rem; }
  @media (max-width: 600px) { .cast { grid-template-columns: 1fr 1fr; gap: .5rem; } }
  .cast .actor { width: auto; animation: none; }
  .cast .actor .avatar { width: 4.6rem; height: 5.5rem; }
  .cast .actor figcaption { font-size: .8rem; }
  @media (max-width: 600px) { .actor { width: 9rem; } .actor .avatar { width: 5rem; height: 6rem; } .bubble { font-size: .85rem; } }

  /* ---------- Úvodní video (přepis animace z Claude Design do vanilla JS) ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 40; background: #15171b; color: #fff;
    display: flex; flex-direction: column;
  }
  #intro[hidden] { display: none; }
  .iv-viewport { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .iv-stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; flex: none;
    background: #F4F1EA; transform-origin: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
    font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  .iv-stage * { box-sizing: border-box; }
  .iv-stage .H { font-family: "Bricolage Grotesque", Georgia, "Segoe UI", system-ui, sans-serif; }
  .iv-abs { position: absolute; }
  .iv-nowrap { white-space: nowrap; }
  .iv-bar {
    flex: none; display: flex; align-items: center; gap: .8rem; padding: .6rem 16px;
    background: #101215; border-top: 1px solid rgba(255,255,255,.1); font-size: .9rem;
  }
  .iv-bar .btn-ghost { color: #fff; border-color: rgba(255,255,255,.3); }

            situace: `Rozpočet je za tebou, ale blíží se volby do Kongresu (v polovině tvého období). Je to pro voliče první velké hodnocení tvé práce. Na čem postavíš kampaň své strany?`,
            volby: [
              { id: "2d-a", text: "Na kompromisu: „umím se dohodnout a stát funguje“.", dz: 5, km: 0,
                dusledek: "Kampaň je nudná, ale důvěryhodná. Tvoje strana ztrácí méně, než se čekalo. Umírnění voliči oceňují, že úřady fungují.",
                realita: "Strana prezidenta ve volbách v polovině období skoro vždy ztrácí křesla. Výjimky jsou vzácné (např. 2002).",
                pojem: { nazev: "Rozdělená vláda", text: "V USA je normální, že prezident je z jedné strany a většina Kongresu z druhé. Zhruba 60 % doby po druhé světové válce. Systém s tím počítá a nutí k dohodám." },
                proc: "Prezidentský systém odměňuje schopnost dohody napříč stranami, protože prezident bez Kongresu nic neprosadí. Kampaň na kompromisu je sázka na to, že voliči chtějí fungující stát víc než vítězství své strany.",
                kontrafaktual: "Kdybys kampaňoval na konfrontaci, mobilizoval bys vlastní tábor, ale prohloubil polarizaci. Nová většina v Kongresu by s tebou jednala ještě hůř." },
              { id: "2d-b", text: "Na konfrontaci: „Kongres mi brání plnit sliby“.", dz: -5, km: 5,
                dusledek: "Mobilizoval jsi vlastní tábor, ale i ten druhý. Volby jsou těsné a nenávistné. Ať dopadnou jakkoli, Kongres je po nich rozdělenější.",
                realita: "Polarizace Kongresu v posledních desetiletích prudce vzrostla: poslanci hlasují téměř výhradně podle strany a kompromisy jsou vzácnější než dřív.",
                pojem: { nazev: "Polarizace", text: "Když se politici rozdělí do dvou nesmiřitelných táborů, kompromis je skoro nemožný. V prezidentském systému, kde prezident potřebuje Kongres, to vede k patu." },
                proc: "Konfrontační kampaň funguje ve volbách, ale v systému dělby moci se po volbách musíš s protistranou zase dohodnout. Čím víc polarizace, tím horší vyjednávání a tím blíž k patu.",
                kontrafaktual: "Kdybys postavil kampaň na kompromisu, strana by možná ztratila podobně, ale nová většina by s tebou byla ochotná jednat." }
            ]
          }
        }
      },
      { /* 1.3 */
        situace: `Volby do Kongresu vyhrála opozice ještě výrazněji. Teď má obě komory. Ty máš před sebou dva roky do konce období ([[pevne-obdobi|pevné funkční období]]). Jak budeš vládnout?`,
        volby: [
          { id: "3a", text: "Uznat výsledek a hledat s novou většinou společné body.", dz: 10, km: -10,
            dusledek: "Tvoje velké reformy jsou pryč, ale menší zákony procházejí. Stát funguje. Voliči vidí prezidenta, který přijal porážku a pracuje dál.",
            realita: "Prezidenti USA po ztrátě Kongresu často přecházejí k menším dohodám a zahraniční politice, kde mají volnější ruce. Např. prezident Clinton po roce 1994 nebo Obama po roce 2010.",
            pojem: { nazev: "Pevné funkční období jako výhoda", text: "Prezident po prohraných volbách do Kongresu nepadá. Dokončí období, stát je stabilní a předvídatelný. To je silná stránka systému." },
            proc: "Prezidentský systém dává stabilitu: prezident vládne dál i bez většiny. Cena je, že musí vyjednávat. Když to udělá, systém funguje a dělba moci se ukáže jako pojistka, ne jako překážka.",
            kontrafaktual: "Kdybys dál obcházel Kongres příkazy, dva roky by se vedla válka příkazů, žalob a vyšetřování. Kdybys jen vetoval, nic by neprošlo a stát by se zasekl." },
          { id: "3b", text: "Dál obcházet Kongres exekutivními příkazy a tvrdit, že mandát máš ty.", dz: -10, km: 15,

            realita: "Exekutivní příkazy používají všichni prezidenti USA, ale jejich dosah omezují zákony a soudy. Prezident, který se jimi snaží vládnout místo Kongresu, naráží na soudy a na vyšetřování.",
            pojem: { nazev: "Vládnutí dekrety a jeho meze", text: "V USA je vládnutí příkazy omezené: soudy a Kongres je můžou zrušit. Ve slabších demokraciích je to cesta k autoritářství. Rozdíl dělají instituce." },
            proc: "Tady vidíš, proč jsou USA jiné než křehké demokracie: i prezident, který obchází Kongres, narazí na soudy, na peníze a na vyšetřování. Instituce ho zpomalí a zastaví. Cena je ale pat a eroze důvěry.",
            kontrafaktual: "Kdybys uznal výsledek a vyjednával, stát by fungoval a tvoje druhá polovina období by byla klidnější, i když bez velkých reforem." },
          { id: "3c", text: "Vetovat vše, co nová většina pošle, a čekat na příští prezidentské volby.", dz: -5, km: 0,
            dusledek: "Dva roky se nic nehýbe. Kongres schvaluje, ty vetuješ, Kongres nemá dvě třetiny na přehlasování. Stát funguje jen na setrvačnost. Voliči jsou unavení z obou stran.",
            realita: "Veto bylo v historii USA přehlasováno jen u malého zlomku případů. Prezident bez většiny tak může Kongres zablokovat, ale ne prosadit nic vlastního.",
            pojem: { nazev: "Pat (deadlock)", text: "Prezident a parlament se zablokují a nic se nehýbe. V prezidentském systému to může trvat celé roky, protože nikdo nemůže vypsat předčasné volby." },
            proc: "Veto je obranná zbraň. Prezident s ním nic neprosadí, jen zastaví druhou stranu. V parlamentním systému by takový stav vedl k pádu vlády a novým volbám. V prezidentském musí všichni čekat do konce období.",
            kontrafaktual: "Kdybys hledal společné body, menší zákony by prošly a stát by fungoval. Kdybys obcházel Kongres, přišla by vlna žalob a vyšetřování." }
        ]

  /* ===================== CESTA 2: USA + ZÁKONODÁRNÁ MOC ===================== */
  "usa-zakonodarci": {
    nazev: "USA: hraješ za zákonodárnou moc",
    start: { dz: 70, km: 45 },
    brief: `Jsi vůdce většiny ve Sněmovně reprezentantů. Prezident začíná obcházet zákony [[exekutivni-prikaz|exekutivními příkazy]] a tvrdí, že má [[mandat]] od lidu. Soudy zatím mlčí. Tvůj úkol: udržet rovnováhu mocí, aniž bys rozbil stát.`,
    body: [
      { /* 2.1 */
        situace: `Prezident vydal sérii sporných příkazů: přesouvá peníze bez souhlasu Kongresu a obchází zákon, který jsi schválil. Jaký nástroj z [[brzdy|brzd a rovnováh]] použiješ první?`,
        volby: [
          { id: "1a", text: "Podat žalobu k federálnímu soudu.", dz: 5, km: -5,
            dusledek: "Soud se případem zabývá měsíce, ale nakonec část příkazů zruší. Pomalé, ale čisté: nikdo nemůže říct, že jsi porušil pravidla.",
            realita: "Sněmovna reprezentantů v roce 2019 žalovala administrativu kvůli přesunu peněz na zeď na hranici. Federální soudy část financování zablokovaly.",
            pojem: { nazev: "Soudní přezkum", text: "Soud posoudí, zda je prezidentův příkaz v souladu s ústavou a zákony, a může ho zrušit. Je to nejklidnější brzda, ale pomalá." },
            proc: "Zákonodárci v USA nemusí hned sahat po nejtěžší zbrani. Mají nezávislé soudy, které spor rozhodnou podle pravidel. Tahle možnost existuje jen tam, kde prezident soudy neovládá.",
            kontrafaktual: "Kdybys zablokoval rozpočet, zasáhl bys prezidenta rychleji, ale riskoval shutdown. Kdybys zahájil vyšetřování, zvýšil bys polarizaci dřív, než máš důkazy." },
          { id: "1b", text: "Zablokovat prezidentovi rozpočet (power of the purse).", dz: 0, km: -5,
            dusledek: "Prezident nemá peníze na své projekty. Ale hrozí shutdown a část veřejnosti viní tebe, ne prezidenta. Je to silná zbraň, která tne na obě strany.",
            realita: "Kongres opakovaně použil rozpočet proti prezidentovi: od války ve Vietnamu (zákaz financování operací v Kambodži 1973) po spory o zeď na hranici.",
            pojem: { nazev: "Kontrola nad penězi (power of the purse)", text: "Jen Kongres smí přidělovat peníze úřadům. Bez jeho souhlasu prezident nic nepostaví. Hlavní zbraň parlamentu." },
            proc: "Rozpočet je nejsilnější zbraň Kongresu, protože prezident bez peněz nemůže vládnout. Ale v systému s pevnými mandáty nikdo neodstoupí, takže blokáda končí shutdownem, ne pádem vlády.",
            kontrafaktual: "Kdybys šel k soudu, trvalo by to déle, ale bez shutdownu. Kdybys zahájil vyšetřování, obešel bys rozpočet, ale polarizoval zemi." },
          { id: "1c", text: "Zahájit vyšetřování a směřovat k impeachmentu.", dz: 0, km: 0,
            dusledek: "Vyšetřovací výbor má veřejná slyšení. Prezident mluví o „honu na čarodějnice“. Země je rozdělená, ale důkazy se postupně hromadí.",
            realita: "Vyšetřování Watergate (1973 až 1974) začalo senátním výborem a trvalo přes rok, než se objevily nahrávky, které prezidenta Nixona usvědčily.",
            pojem: { nazev: "Impeachment jako politický proces", text: "Impeachment je ústavní nástroj, ale rozhoduje o něm Kongres, ne soud. Je proto vždy i politický a prohlubuje rozdělení." },
            proc: "Impeachment je nejtěžší brzda. V prezidentském systému je to jediná cesta, jak odvolat prezidenta mezi volbami. Protože ale rozhoduje politický orgán, je to vždy souboj stran, ne jen právní otázka.",
            kontrafaktual: "Kdybys začal žalobou nebo rozpočtem, polarizace by rostla pomaleji a vyšetřování by bylo později věrohodnější." }
        ]
      },
      { /* 2.2 */
        situace: `Objevily se důkazy o zneužití moci: svědectví spolupracovníků, ale zatím žádná „kouřící zbraň“. V Senátu má tvoje strana 53 hlasů ze 100, k odsouzení prezidenta je potřeba 67. Co uděláš?`,
        volby: [
          { id: "2a", text: "Tlačit na impeachment hned, i bez jistoty v Senátu.", dz: -5, km: 0, vetev: "obzaloba",
            dusledek: "Sněmovna prezidenta obžalovala po stranické linii. Tvoji voliči slaví, druhá polovina země mluví o puči. Senát je rozdělený a dvě třetiny nemáš.",
            realita: "Prezident Clinton byl obžalován v prosinci 1998 a Senát ho v únoru 1999 zprostil. Prezident Trump byl obžalován dvakrát (prosinec 2019, leden 2021) a Senát ho zprostil v obou případech.",
            pojem: { nazev: "Impeachment: Sněmovna obžaluje, Senát soudí", text: "Sněmovna obžaluje prostou většinou. Senát soudí a k odsouzení potřebuje dvě třetiny. Proto obžaloba bez podpory druhé strany nikdy nekončí odvoláním." },
            proc: "Ústava USA udělala odvolání prezidenta záměrně těžké, aby většina Kongresu nemohla shodit prezidenta jen proto, že se jí nelíbí. Chrání to stabilitu, ale znamená to, že bez důkazů, které přesvědčí i druhou stranu, prezident zůstane.",
            kontrafaktual: "Kdybys počkal na silnější důkazy, obžaloba by měla větší šanci v Senátu. Kdybys nechal rozhodnout volby, vyhnul by ses obvinění z puče, ale prezident by zůstal bez kontroly." },
          { id: "2b", text: "Počkat na silnější důkazy a pokračovat ve vyšetřování.", dz: 5, km: 0, vetev: "obzaloba",
            dusledek: "Vyšetřování trvá dál. Po měsících se objevují dokumenty, které prezidenta přímo usvědčují. Část senátorů jeho strany se začíná odvracet.",
            realita: "Ve Watergate rozhodly nahrávky z Oválné pracovny, které musel prezident Nixon vydat po rozhodnutí Nejvyššího soudu (červenec 1974). Teprve pak ztratil podporu vlastní strany.",
            pojem: { nazev: "Impeachment jako ústavní, ale politicky náročný nástroj", text: "Důkazy musí přesvědčit i senátory prezidentovy strany. Bez nich je impeachment jen gesto. S nimi je to nejsilnější brzda v systému." },
            proc: "Protože k odsouzení jsou potřeba dvě třetiny Senátu, impeachment uspěje jen tehdy, když prezidentova vlastní strana uzná, že je neudržitelný. Trpělivost tady není slabost, je to jediná cesta, jak brzda může fungovat.",
            kontrafaktual: "Kdybys spěchal, obžaloba by prošla Sněmovnou, ale v Senátu by neuspěla a prezident by to prodal jako vítězství. Kdybys nechal rozhodnout volby, prezident by možná vyhrál znovu." },
          { id: "2c", text: "Nechat rozhodnout příští volby. Voliči ať to posoudí.", dz: 0, km: 5, vetev: "volby",
            dusledek: "Vyšetřování pokračuje, ale bez obžaloby. Prezident mezitím vydává další příkazy. Kampaň je o něm: buď ho voliči potrestají, nebo mu dají nový mandát.",
            realita: "Část Kongresu v obou velkých sporech (1998, 2019) argumentovala, že o prezidentovi mají rozhodnout voliči, ne impeachment. Je to legitimní, ale ponechává to prezidenta bez kontroly do voleb.",
            pojem: { nazev: "Pevné funkční období (rigidita)", text: "Prezident sedí do konce období, ať dělá cokoli. Jediný „soud“ mimo impeachment jsou další volby, a ty můžou být daleko." },
            proc: "V parlamentním systému by vláda, která ztratila důvěru, padla. V prezidentském musíš buď použít impeachment, nebo čekat na volby. To je rigidita: výhoda (stabilita) i riziko (špatný lídr zůstává) v jednom.",
            kontrafaktual: "Kdybys zahájil obžalobu, systém by prezidenta alespoň viditelně brzdil. Kdybys počkal na důkazy, mohl bys mít obojí: brzdu i věrohodnost." }
        ]
      },
      { /* 2.3: podle větve z 2.2 */
        podle: true,
        varianty: {
          obzaloba: {
            situace: `Sněmovna prezidenta obžalovala. Teď ho soudí Senát pod vedením předsedy Nejvyššího soudu. K odsouzení je potřeba 67 hlasů, tvoje strana má 53. Jak povedeš závěr?`,
            volby: [
              { id: "3o-a", text: "Jednat se senátory prezidentovy strany a nabídnout prezidentovi odchod se ctí (rezignaci).", dz: 10, km: -20, flag: "impeachment",
                dusledek: "Vedení prezidentovy strany mu řeklo, že hlasy v Senátu nemá. Prezident rezignoval. Systém se ubránil bez odsouzení: stačila věrohodná hrozba.",
                realita: "Prezident Nixon rezignoval 9. srpna 1974 poté, co mu vedoucí republikáni v Kongresu sdělili, že by při hlasování v Senátu nejspíš neobstál. Sněmovna o obžalobě ani nemusela hlasovat.",
                pojem: { nazev: "Impeachment jako pojistka, která funguje hrozbou", text: "Impeachment v USA nikdy neskončil odsouzením. Jediný prezident, kterého donutil odejít, odešel sám, protože viděl, že hlasy proti němu má i vlastní strana." },
                proc: "Brzda fungovala, protože instituce byly silnější než stranická loajalita. V zemi, kde prezident ovládá soudy a strana ho drží za každou cenu, by stejná obžaloba nic nezmohla. Tady vidíš, jak krize končí v mezích pravidel.",
                kontrafaktual: "Kdybys hlasoval hned po stranické linii, Senát by prezidenta zprostil a on by zůstal do konce období s pocitem vítězství.",
                poznamka: "V tvé cestě prezident odstoupil dřív, než Senát hlasoval. Impeachment zafungoval jako hrozba, ne jako rozsudek." },
              { id: "3o-b", text: "Hlasovat hned, bez podpory druhé strany.", dz: -5, km: 0, flag: "impeachment",
                dusledek: "Senát prezidenta zprostil: 53 hlasů pro odsouzení, 47 proti, daleko od 67. Prezident mluví o „úplném očištění“ a zůstává do konce období. Polarizace je rekordní.",
                realita: "Senát zprostil prezidenta Clintona v únoru 1999 a prezidenta Trumpa v únoru 2020 i v únoru 2021. Ani jednou nebylo odsouzení blízko dvoutřetinové většině.",
                pojem: { nazev: "Dvoutřetinová většina v Senátu", text: "Záměrně vysoká laťka. Zabraňuje odvolání prezidenta z politických důvodů, ale zároveň znamená, že prezident se silnou stranou je prakticky neodvolatelný." },
                proc: "Impeachment je ústavní, ale rozhoduje politika. Když se Senát rozhoduje podle stran, dvě třetiny nikdo nesežene. Systém tak zůstal v mezích pravidel, ale prezident vyvázl. To je ta rigidita: špatného lídra je mezi volbami skoro nemožné sundat.",
                kontrafaktual: "Kdybys jednal se senátory druhé strany a dal prezidentovi možnost odejít, mohl se systém ubránit jako v roce 1974.",
                poznamka: "V tvé cestě Senát prezidenta zprostil. Ústavní nástroj byl použit, ale prezident zůstal. Přesně tak dopadly všechny tři impeachmenty v historii USA." },
              { id: "3o-c", text: "Stáhnout obžalobu ze Senátu a soustředit se na volby.", dz: 5, km: 5,
                dusledek: "Obžaloba zůstala viset bez soudu. Prezident ji prodává jako prohru Kongresu, ale vyšetřování ho oslabilo. Rozhodnou volby.",
                realita: "Tenhle postup se v USA nestal, ale debata o tom, zda obžalobu vůbec posílat do Senátu, proběhla v lednu 2020 (Sněmovna ji několik týdnů zadržovala).",
                pojem: { nazev: "Volby jako poslední brzda", text: "Když impeachment selže nebo není možný, zbývají jen volby. V prezidentském systému s pevným obdobím na ně můžeš čekat i roky." },
                proc: "Ukazuje to meze brzd: Kongres může prezidenta brzdit a vyšetřovat, ale odvolat ho bez podpory jeho strany nemůže. Nakonec rozhodují voliči, což je výhoda (přímá odpovědnost) i riziko (do té doby je prezident bez kontroly).",
                kontrafaktual: "Kdybys nechal Senát hlasovat, prezident by byl zproštěn, ale záznam by byl jasný. Kdybys vyjednával rezignaci, mohl odejít sám." }
            ]
          },
          volby: {
            situace: `Volby proběhly. Prezident je oslabený, ale zůstává. Tvoje strana udržela Sněmovnu. Prezident navrhuje dohodu: omezí příkazy, když mu pustíš část rozpočtu. Co uděláš?`,
            volby: [
              { id: "3v-a", text: "Vyjednat dohodu o mezích exekutivních příkazů.", dz: 10, km: -10,
                dusledek: "Dohoda prošla: Kongres schválil zákon, který omezuje přesuny peněz bez souhlasu Kongresu, prezident ho podepsal. Spor skončil novým pravidlem.",
                realita: "Po Watergate Kongres přijal řadu zákonů, které omezily prezidenta: např. zákon o rozpočtu (1974), který mu zakázal zadržovat peníze schválené Kongresem, a zákon o válečných pravomocech (1973).",
                pojem: { nazev: "Brzdy a rovnováhy jako učící se systém", text: "Krize v USA často končí novým zákonem, který příští krizi ztíží. Instituce se tak posilují právě tím, že prošly sporem." },
                proc: "Prezidentský systém umí krizi vyřešit dohodou, protože obě strany sedí dál a musí spolu vyjít. Když je zvykem respektovat pravidla, spor skončí novým pravidlem, ne převratem.",
                kontrafaktual: "Kdybys blokoval vše, prezident by vládl příkazy dál a stát by se zasekl do konce jeho období." },

  /* ===================== CESTA 3: LATINSKÁ AMERIKA + PREZIDENT ===================== */
  "latam-prezident": {
    nazev: "Latinská Amerika: hraješ za prezidenta",
    start: { dz: 60, km: 35 },
    brief: `Jsi nově zvolený reformní prezident. Vyhrál jsi těsně, jen s malou částí hlasů ([[winner-takes-all|vítěz bere vše]]). Kongres ovládá [[opozice]], ekonomika se hroutí a společnost je rozdělená na dva tábory. Chceš prosadit velké reformy, Kongres ti je blokuje. Armáda zatím mlčí.
    <br><br><span class="muted">Scénář vychází z Chile za prezidenta Salvadora Allendeho (1970 až 1973). Allende vyhrál s přibližně 36 % hlasů a Kongres ho zvolil až po dohodě s opozicí.</span>`,
    body: [
      { /* 3.1 */
        situace: `Kongres zablokoval tvé klíčové reformy (znárodnění, pozemková reforma). Tvoji voliči čekají výsledky. Opozice říká, že většina lidí tě nevolila. Ty říkáš, že máš [[mandat]]. Co uděláš?`,
        volby: [
          { id: "1a", text: "Trpělivě vyjednávat s opozicí a reformy rozložit v čase.", dz: 10, km: 0, vetev: "klid",
            dusledek: "Část reforem prošla v menší podobě. Tvoji radikálnější příznivci jsou netrpěliví a mluví o zradě. Ale Kongres s tebou jedná a armáda zůstává v kasárnách.",
            realita: "V Chile jednal Allende s křesťanskými demokraty o kompromisu několikrát (naposledy v srpnu 1973), ale jednání vždy ztroskotala na tlaku radikálů v obou táborech.",
            pojem: { nazev: "Dvojí legitimita", text: "Ty i Kongres jste zvoleni lidem. Ústava neříká, kdo má ustoupit. Jediná cesta v mezích pravidel je dohoda." },
            proc: "V prezidentském systému nejde spor mezi prezidentem a parlamentem vyřešit tím, že jeden druhého odvolá. Buď dohoda, nebo pat. Vyjednávání je pomalé a frustruje voliče, ale drží systém pohromadě.",
            kontrafaktual: "Kdybys vládl dekrety, reformy by šly rychle, ale opozice a soudy by je prohlásily za nezákonné a konflikt by eskaloval. Kdybys vyvedl lidi do ulic, mobilizoval bys i druhou stranu." },
          { id: "1b", text: "Vládnout dekrety a obcházet Kongres.", dz: -15, km: 20, vetev: "eskalace",
            dusledek: "Reformy běží přes nařízení a staré, zapomenuté zákony. Kongres je prohlašuje za neplatné, kontrolní úřad je odmítá podepsat. Opozice říká, že porušuješ ústavu. Dva zdroje moci, dvě pravdy.",
            realita: "Allendeho vláda využívala k přebírání podniků dekrety a zákon z roku 1932, aby obešla Kongres. Opoziční Kongres v srpnu 1973 přijal usnesení, že vláda porušuje ústavu, a vyzval armádu k „obnovení pořádku“.",
            pojem: { nazev: "Vládnutí dekrety", text: "Prezident obchází parlament a vládne vlastními nařízeními. Ve slabé demokracii je to cesta ke koncentraci moci a k otevřenému střetu s parlamentem." },
            proc: "Dvojí legitimita naplno: prezident se odvolává na své voliče, Kongres na své. Když prezident začne vládnout dekrety, parlament ztrácí důvod respektovat pravidla a začne hledat jiné spojence, včetně armády.",
            kontrafaktual: "Kdybys vyjednával, reformy by byly menší, ale Kongres by neměl důvod volat armádu. Kdybys mobilizoval ulici, konflikt by se přesunul z institucí na náměstí." },
          { id: "1c", text: "Vyvést své příznivce do ulic a tlačit silou mobilizace.", dz: -10, km: 5, vetev: "eskalace",
            dusledek: "Obrovské demonstrace na tvou podporu. O týden později ještě větší demonstrace opozice. Stávky, zablokované silnice, první násilí. Kongres tě viní z chaosu.",
            realita: "V Chile se v letech 1972 až 1973 střídaly masové demonstrace obou táborů, stávky dopravců a obchodníků, zabírání továren a pouliční násilí. Země se dělila na dva nesmiřitelné tábory.",
            pojem: { nazev: "Polarizace", text: "Společnost se rozdělí do dvou táborů, které se považují za nepřátele. Kompromis je pak zrada. V prezidentském systému, kde vítěz bere vše, polarizace roste rychle." },

            kontrafaktual: "Kdybys vyjednával, reformy by zpomalily, ale ulice by zůstala klidná. Kdybys vládl dekrety, střet by zůstal v institucích, ale Kongres by tě obvinil z porušení ústavy." }
        ]

      { /* 3.2: podle větve z 3.1 */
        podle: true,
        varianty: {
          klid: {
            situace: `Polarizace přesto roste. Inflace stoupá, stávky dopravců ochromují zásobování, opozice v Kongresu tvrdí, že tvá vláda je nelegitimní. Armáda „sleduje situaci“. Co uděláš?`,
            volby: [
              { id: "2k-a", text: "Zmírnit tempo a nabídnout národní dohodu s opozicí.", dz: 10, km: -5, vetev: "dohoda",

                realita: "V Chile se o takovou dohodu pokoušel kardinál Silva Henríquez jako prostředník v srpnu 1973. Jednání ztroskotala. Historici se shodují, že to byla poslední šance odvrátit převrat.",

                proc: "Prezidentský systém nemá ventil, který má parlamentní (pád vlády, nové volby). Když prezident ani Kongres nemůžou odejít, jediná cesta, jak snížit tlak, je dohoda. Vyžaduje, aby obě strany uznaly druhou jako soupeře, ne nepřítele.",

                realita: "Chile 1972 až 1973: inflace přes 300 %, nedostatek zboží, stávky, násilí. Obě strany se obviňovaly ze sabotáže. Kongres 22. srpna 1973 přijal usnesení o porušování ústavy vládou.",
                pojem: { nazev: "Pevné funkční období (rigidita)", text: "Krize se nedá vyřešit předčasnými volbami. Prezident má mandát do roku 1976, Kongres do dalších voleb. Tlak roste a nemá kam uniknout." },
                proc: "Tady vidíš Linzův argument naplno: rigidita (nikdo nemůže odejít) plus dvojí legitimita (oba mají mandát) plus polarizace (druhá strana je nepřítel). Když chybí ventil, tlak hledá cestu mimo ústavu.",
                kontrafaktual: "Kdybys nabídl národní dohodu, armáda by neměla záminku a umírněná opozice by měla důvod jednat." }
            ]
          },
          eskalace: {
            situace: `Polarizace prudce roste. Inflace, nedostatek zboží, stávky, zabírání továren. Nejvyšší soud prohlásil, že tvá vláda nerespektuje jeho rozhodnutí. Armáda začíná být nervózní a generálové se scházejí. Co uděláš?`,
            volby: [
              { id: "2e-a", text: "Zmírnit a hledat národní dohodu s opozicí a církví jako prostředníkem.", dz: 10, km: -5, vetev: "armada",
                dusledek: "Vrátil ses k jednání. Umírněná opozice chce záruky: konec dekretů, odzbrojení milic. Radikálové v tvém táboře mluví o zradě. Armáda jednání sleduje, ale přestala se scházet.",
                realita: "V srpnu 1973 se Allende pokoušel o dohodu s křesťanskými demokraty, ale podmínky (mimo jiné vojáci ve vládě) nedokázaly uklidnit ani jednu stranu. O tři týdny později přišel převrat.",
                pojem: { nazev: "Rigidita (pevné funkční období)", text: "Krize se nedá vyřešit předčasnými volbami. Prezident musí buď najít dohodu, nebo doufat, že vydrží do konce období." },
                proc: "Vrácení konfliktu do institucí je jediná cesta v mezích pravidel. Ale čím později k ní dojde, tím míň důvěry zbývá. Prezidentský systém nemá nástroj, jak krizi rychle uzavřít, takže dohoda vždy přichází pozdě a draho.",
                kontrafaktual: "Kdybys přitvrdil, Kongres a soudy by přestaly být tvými soupeři a staly by se spojenci armády." },
              { id: "2e-b", text: "Přitvrdit a obvinit opozici ze sabotáže.", dz: -15, km: 10, vetev: "armada",

                realita: "Generál Carlos Prats, loajální ústavě, rezignoval 23. srpna 1973. Nahradil ho Augusto Pinochet. Kongres den předtím přijal usnesení, že vláda porušuje ústavu.",
                pojem: { nazev: "Rigidita a zlom", text: "Když prezident ani parlament nemůžou odejít a žádný se nechce dohodnout, instituce ztrácejí důvěru a vzniká prostor pro „řešení“ mimo ústavu." },
                proc: "Spojení dvojí legitimity, rigidity a polarizace. Každý má mandát, nikdo nemůže odejít, druhá strana je nepřítel. V zemi, kde armáda není pevně pod civilní kontrolou, je převrat logické vyústění, ne náhoda.",
                kontrafaktual: "Kdybys nabídl národní dohodu, nebylo by jisté, že uspěje, ale armáda by ztratila záminku „obnovit pořádek“." }

      { /* 3.3: podle větve z 3.2 */
        podle: true,
        varianty: {
          dohoda: {
            situace: `Armáda zůstává v kasárnách. Dohoda s opozicí drží, ale Kongres ti dál blokuje velké reformy. Tvoji radikální příznivci chtějí referendum o nové ústavě, které by Kongres obešlo. Co uděláš?`,
            volby: [
              { id: "3d-a", text: "Přijmout menší reformy a dokončit období v mezích pravidel.", dz: 5, km: -5,

          armada: {
            situace: `Armáda otevřeně naznačuje zásah. Generálové žádají tvou rezignaci „v zájmu národa“. Část tvých příznivců chce zbraně a odpor. Umírnění ti radí nabídnout [[prevrat|armádě]] a opozici východisko. Co uděláš?`,

                realita: "Allende podle svědectví plánoval oznámit referendum o své vládě 11. září 1973. Ten den ráno začal převrat. Nevíme, jestli by referendum krizi odvrátilo.",

                pojem: { nazev: "Převrat (puč)", text: "Mimoústavní převzetí moci, typicky armádou. Řešení krize mimo pravidla. Nejhorší konec, k jakému prezidentský systém může dojít." },

                kontrafaktual: "Kdybys nabídl referendum a odstoupení, nebylo by jisté, že armáda ustoupí, ale demokracie by měla šanci." }

  /* ===================== CESTA 4: LATINSKÁ AMERIKA + ZÁKONODÁRNÁ MOC ===================== */
  "latam-zakonodarci": {
    nazev: "Latinská Amerika: hraješ za zákonodárnou moc",
    start: { dz: 50, km: 65 },
    brief: `Jsi vůdce opoziční většiny v Kongresu. Právě jste vyhráli parlamentní volby. Prezident ale koncentruje moc: vládne [[dekrety]], oslabuje soudy a chce měnit ústavu. Tvůj úkol: demokratickými prostředky zabránit tomu, aby se z prezidenta stal vládce bez kontroly.
    <br><br><span class="muted">Scénář vychází z Venezuely po roce 2015. Opozice tehdy vyhrála volby do Národního shromáždění, ale prezident Maduro jeho pravomoci postupně obešel.</span>`,
    body: [
      { /* 4.1 */
        situace: `Prezident obchází Kongres: vydává dekrety se silou zákona a Kongres ignoruje. Většinu máš, ale prezident jmenoval na poslední chvíli nové soudce Nejvyššího soudu ze svých lidí. Jaký nástroj použiješ?`,
        volby: [
          { id: "1a", text: "Napadnout dekrety u Nejvyššího soudu.", dz: 5, km: 0,
            dusledek: "Soud rozhodl do týdne: všechny dekrety jsou v pořádku a Kongres je „v pohrdání“ soudem. Soud, který má prezidenta hlídat, hlídá Kongres. Ale veřejnost i zahraničí viděly, že jsi šel ústavní cestou.",

<script>
"use strict";

/* ---------- Herní stav (jediný zdroj pravdy) ---------- */
const state = {
  screen: "uvod",
  primerIndex: 0,
  zeme: null,          // "usa" | "latam"
  role: null,          // "prezident" | "zakonodarci"
  dz: 70, km: 30,
  bodIndex: 0,         // 0..2
  log: [],             // [{bodIndex, situace, volba, dzPred, kmPred, dzPo, kmPo}]
  flags: {},           // {prevrat: true, impeachment: true}
  konec: null,
  pending: null,       // volba čekající na "Dál"
  dokoncene: {}        // {"usa-prezident": "stabilita", ...} jen v paměti
};

const $ = (sel) => document.querySelector(sel);
const app = $("#app");
const stav = $("#stav");
const glossaryById = Object.fromEntries(GLOSSARY.map(g => [g.id, g]));

/* ---------- Pomocné funkce pro text ---------- */

// Nezlomitelné mezery za jednopísmennými předložkami a spojkami (česká typografie).
function nbsp(html) {
  return html.replace(/(^|[\s(„"‚>])([ksvzouaiKSVZOUAI])\s+(?=\S)/g, "$1$2 ");
}

// Převod značek [[id]] a [[id|text]] na klikací pojmy.
function renderTerms(html) {
  return html.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, text) => {
    const g = glossaryById[id];
    if (!g) return text || id;
    // Bez explicitního textu: název pojmu bez závorky, s malým písmenem (uprostřed věty)
    const base = g.pojem.replace(/\s*\(.*$/, "");
    const label = text || base.charAt(0).toLowerCase() + base.slice(1);
    return `<button type="button" class="term" data-term="${id}" aria-describedby="popover">${label}</button>`;
  });
}

function fmt(html) { return nbsp(renderTerms(html)); }

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function scenarioKey() { return `${state.zeme}-${state.role}`; }
function scenario() { return SCENARIOS[scenarioKey()]; }

/* ---------- Ukazatele ---------- */
function clamp(v) { return Math.max(0, Math.min(100, v)); }

function renderStav(deltaDz, deltaKm) {
  const dzBar = $("#dzBar"), kmBar = $("#kmBar");
  $("#dzVal").textContent = state.dz;
  $("#kmVal").textContent = state.km;
  dzBar.setAttribute("aria-valuenow", state.dz);
  kmBar.setAttribute("aria-valuenow", state.km);
  dzBar.classList.toggle("low", state.dz < 40);
  dzBar.classList.toggle("mid", state.dz >= 40 && state.dz < 65);
  kmBar.classList.toggle("high", state.km >= 70);
  kmBar.classList.toggle("mid", state.km >= 50 && state.km < 70);
  requestAnimationFrame(() => {
    dzBar.firstElementChild.style.width = state.dz + "%";
    kmBar.firstElementChild.style.width = state.km + "%";
  });
  const d1 = $("#dzDelta"), d2 = $("#kmDelta");
  const showDelta = (el, d) => {
    el.textContent = d ? (d > 0 ? `+${d}` : `${d}`) : "";
    el.className = "delta " + (d > 0 ? "plus" : d < 0 ? "minus" : "");
  };
  showDelta(d1, deltaDz || 0);
  showDelta(d2, deltaKm || 0);
}

/* ---------- Logika konce ---------- */
function urciKonec() {
  const z = ZEME[state.zeme];
  if (state.flags.prevrat) return "rozpad";
  if (state.dz < z.prahRozpad) return "rozpad";
  if (state.km >= 80) return "rozpad";
  if (state.flags.impeachment) return state.km >= 75 ? "rozpad" : "impeachment";
  if (state.dz >= 65) return "stabilita";
  return "pat";
}

/* ---------- Aktuální rozhodovací bod ---------- */
function aktualniBod() {
  const bod = scenario().body[state.bodIndex];
  if (!bod.podle) return bod;
  const posledni = state.log[state.log.length - 1];
  const vetev = posledni && posledni.volba.vetev;
  return bod.varianty[vetev] || bod.varianty.default || Object.values(bod.varianty)[0];
}
// Klíč scény pro aktuální bod: "index" nebo "index:vetev"
function bodKlic() {
  const bod = scenario().body[state.bodIndex];
  if (!bod.podle) return String(state.bodIndex);
  const posledni = state.log[state.log.length - 1];
  const vetev = (posledni && posledni.volba.vetev) || "default";
  return `${state.bodIndex}:${bod.varianty[vetev] ? vetev : Object.keys(bod.varianty)[0]}`;
}

/* ---------- Postavy: kreslené SVG avatary ----------
   avatarSvg(vzhled, nalada) vrací SVG; nálady mění obočí, oči a ústa. */
function avatarSvg(v, nalada) {
  const skin = v.plet || "#E8B894", hair = v.vlasy || "#2B2B2B", suit = v.oblek || "#3A3A3A";
  const dop = v.doplnky || [];
  const ink = "#1B1E24";
  // Vlasy (za hlavou a čepice/pokrývka)
  let hairBack = "", hairFront = "";
  switch (v.ucel) {
    case "dlouhe": hairBack = `<path d="M24 46 Q22 14 50 14 Q78 14 76 46 L79 86 L64 86 L64 52 Q50 42 36 52 L36 86 L21 86 Z" fill="${hair}"/>`; break;
    case "drdol": hairBack = `<circle cx="50" cy="19" r="9" fill="${hair}"/>`; hairFront = `<path d="M26 44 Q26 18 50 18 Q74 18 74 44 Q64 30 50 32 Q36 30 26 44 Z" fill="${hair}"/>`; break;
    case "kudrnate": hairFront = [[30, 30], [38, 22], [50, 18], [62, 22], [70, 30], [26, 40], [74, 40]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="${hair}"/>`).join(""); break;
    case "plesaty": hairFront = `<path d="M26 44 Q24 34 30 30 L32 42 Z M74 44 Q76 34 70 30 L68 42 Z" fill="${hair}"/>`; break;
    default: hairFront = `<path d="M26 44 Q26 18 50 18 Q74 18 74 44 Q62 30 50 32 Q38 30 26 44 Z" fill="${hair}"/>`;
  }
  // Výraz
  const N = nalada || "klid";
  let brows, eyes, mouth;
  switch (N) {

  switch (N) {

    case "starost": mouth = `<path d="M41 60 q9 -6 18 0" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`; break;
    case "hnev": mouth = `<path d="M40 61 q10 -8 20 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`; break;

    case "odhodlani": mouth = `<path d="M42 58 h16" stroke="${ink}" stroke-width="3.2" stroke-linecap="round"/>`; break;

  const cheeks = N === "radost" || N === "hnev" ? `<circle cx="34" cy="53" r="4" fill="#E8766D" opacity=".45"/><circle cx="66" cy="53" r="4" fill="#E8766D" opacity=".45"/>` : "";
  // Doplňky
  let extra = "";
  if (dop.includes("talar")) extra += `<path d="M38 78 L50 96 L62 78 Z" fill="#fff"/>`;
  if (dop.includes("serpa")) extra += `<path d="M30 84 L70 120 L58 120 L26 92 Z" fill="#C8342C"/><path d="M33 86 L66 118" stroke="#fff" stroke-width="2"/>`;
  if (dop.includes("kravata")) extra += `<path d="M46 80 L54 80 L52 88 L54 104 L50 110 L46 104 L48 88 Z" fill="#7A1F2B"/>`;

  return `<svg viewBox="0 0 100 120" role="img" aria-label="${esc(nalada || "")}">

    ${hairFront}${cheeks}${brows}${eyes}${mouth}${extra}

}

const NALADA_POPIS = { klid: "klid", radost: "radost", starost: "starost", hnev: "hněv", strach: "strach", odhodlani: "odhodlání" };
function story() { return STORY[scenarioKey()]; }
function postava(id) { return (story().obsazeni || []).find(p => p.id === id); }
// Scéna: řada postav s bublinami. lines = [{kdo, nalada, rekne}]
function sceneHtml(lines, opts = {}) {
  if (!lines || !lines.length) return "";
  return `<div class="scene" aria-label="Scéna">${lines.map(l => {
    const p = postava(l.kdo); if (!p) return "";
    return `<figure class="actor ${l.kdo === "ty" ? "hrac" : ""} ${l.rekne ? "" : "ticho"}">
      <div class="bubble">${l.rekne ? `„${nbsp(esc(l.rekne))}“` : ""}</div>
      <div class="avatar" title="${NALADA_POPIS[l.nalada] || ""}">${avatarSvg(p.vzhled, l.nalada)}</div>
      <figcaption><strong>${esc(p.jmeno)}</strong><span>${nbsp(esc(opts.role === false ? "" : p.role))}</span></figcaption>
    </figure>`;
  }).join("")}</div>`;
}
function castHtml() {
  const s = story(); if (!s) return "";
  return `<div class="cast">${s.obsazeni.map(p => `<figure class="actor ${p.id === "ty" ? "hrac" : ""}">
    <div class="avatar">${avatarSvg(p.vzhled, "klid")}</div>
    <figcaption><strong>${esc(p.jmeno)}</strong><span>${nbsp(esc(p.role))}</span></figcaption></figure>`).join("")}</div>`;
}
// Závěrečná scéna podle konce; když pro daný konec není, hráč sám s odpovídající náladou
function konecScena() {
  const s = story(); if (!s) return [];
  if (s.konec && s.konec[state.konec]) return s.konec[state.konec];
  const nalada = { stabilita: "radost", pat: "starost", impeachment: "klid", rozpad: "strach" }[state.konec] || "klid";
  return [{ kdo: "ty", nalada, rekne: "" }];
}

/* ---------- Navigace ---------- */
function go(screen) {
  state.screen = screen;
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
  const h = app.querySelector("h1, h2");
  if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
}

function resetHra() {
  state.zeme = null; state.role = null;
  state.bodIndex = 0; state.log = []; state.flags = {}; state.konec = null; state.pending = null;
}

function startScenar() {
  const s = scenario();
  state.dz = s.start.dz; state.km = s.start.km;
  state.bodIndex = 0; state.log = []; state.flags = {}; state.konec = null; state.pending = null;
  go("brief");
}

function zvolit(volbaId) {
  const bod = aktualniBod();
  const volba = bod.volby.find(v => v.id === volbaId);
  const dzPred = state.dz, kmPred = state.km;
  state.dz = clamp(state.dz + (volba.dz || 0));
  state.km = clamp(state.km + (volba.km || 0));
  if (volba.flag) state.flags[volba.flag] = true;
  state.log.push({ bodIndex: state.bodIndex, situace: bod.situace, volba, dzPred, kmPred, dzPo: state.dz, kmPo: state.km, vsechny: bod.volby });
  state.pending = volba;
  render();
  renderStav(volba.dz, volba.km);
  const box = app.querySelector(".result-box");
  if (box) { box.setAttribute("tabindex", "-1"); box.focus({ preventScroll: true }); box.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

function dal() {
  state.pending = null;
  if (state.bodIndex >= 2) {
    state.konec = urciKonec();
    state.dokoncene[scenarioKey()] = state.konec;
    try { localStorage.setItem("prez-odznaky", JSON.stringify(state.dokoncene)); } catch (e) { /* bez localStorage to nevadí */ }
    go("konec");
  } else {
    state.bodIndex++;
    go("bod");
  }
}

function glossaryHtml() {
  const card = (g) => `

        <p>${nbsp(esc(g.dlouze))}</p>
        <p><strong>Příklad:</strong> ${nbsp(esc(g.priklad))}</p>
        <p class="muted small"><strong>Kde se to ve hře objeví:</strong> ${nbsp(esc(g.kde))}</p>
      </div>
    </details>`;
  const core = GLOSSARY.filter(g => g.jadro), ext = GLOSSARY.filter(g => !g.jadro);
  return `
    <h3 class="gl-section">Jádro: znát před hrou</h3>

function render() {
  const inGame = ["brief", "bod", "konec", "debrief"].includes(state.screen);
  stav.hidden = !inGame;
  app.innerHTML = screens[state.screen]();
  if (inGame && !state.pending) renderStav(0, 0);
}

/* ---------- Popover pro pojmy ---------- */
const popover = $("#popover");
function openPopover(btn) {
  const g = glossaryById[btn.dataset.term];
  if (!g) return;
  popover.innerHTML = `<strong>${esc(g.pojem)}</strong>${nbsp(esc(g.kratce))}
    <div class="pop-actions">
      <button type="button" class="btn-ghost" data-glopen="${g.id}">Víc ve slovníčku</button>
      <button type="button" class="btn-ghost" data-popclose="1">Zavřít</button>
    </div>`;
  popover.hidden = false;
  const r = btn.getBoundingClientRect();
  const pw = Math.min(popover.offsetWidth, window.innerWidth - 32);
  let left = r.left + window.scrollX;
  if (left + pw > window.scrollX + window.innerWidth - 16) left = window.scrollX + window.innerWidth - 16 - pw;
  if (left < 16) left = 16;
  popover.style.left = left + "px";
  popover.style.top = (r.bottom + window.scrollY + 8) + "px";
  popover.querySelector("[data-popclose]").focus();
  popover._anchor = btn;
}
function closePopover(refocus) {
  if (popover.hidden) return;
  popover.hidden = true;
  if (refocus && popover._anchor) popover._anchor.focus();
}

/* ---------- Slovníček (dialog) ---------- */
const glDialog = $("#glossary");
function openGlossary(id) {
  $("#glBody").innerHTML = glossaryHtml();
  if (typeof glDialog.showModal === "function") glDialog.showModal(); else glDialog.setAttribute("open", "");
  if (id) {
    const d = $("#glBody").querySelector(`#gl-${id}`);
    if (d) { d.open = true; d.scrollIntoView({ block: "start" }); d.querySelector("summary").focus(); }
  }
}

/* ---------- Téma ---------- */
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = cur ? cur === "dark" : systemDark;
  root.setAttribute("data-theme", isDark ? "light" : "dark");
  try { localStorage.setItem("prez-theme", isDark ? "light" : "dark"); } catch (e) {}
}

/* ---------- Události (delegace) ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) { if (!e.target.closest("#popover")) closePopover(false); return; }

  if (t.classList.contains("term")) { openPopover(t); return; }
  if (t.dataset.popclose) { closePopover(true); return; }
  if (t.dataset.glopen) { closePopover(false); openGlossary(t.dataset.glopen); return; }
  if (!t.closest("#popover")) closePopover(false);

  if (t.id === "btnGlossary") { openGlossary(); return; }
  if (t.id === "btnGlClose") { glDialog.close ? glDialog.close() : glDialog.removeAttribute("open"); return; }
  if (t.id === "btnTheme") { toggleTheme(); return; }
  if (t.id === "btnHome") { go("uvod"); return; }

  if (t.dataset.intro) { Intro.show(() => go("uvod")); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.primer) {
    state.primerIndex = Math.max(0, Math.min(PRIMER.length - 1, state.primerIndex + Number(t.dataset.primer)));
    go("primer"); return;
  }
  if (t.dataset.zeme) { state.zeme = t.dataset.zeme; go("role"); return; }
  if (t.dataset.role) { state.role = t.dataset.role; startScenar(); return; }
  if (t.dataset.volba) { zvolit(t.dataset.volba); return; }
  if (t.dataset.dal) { dal(); return; }
  if (t.dataset.restart) { resetHra(); go("zeme"); return; }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closePopover(true);
});

glDialog.addEventListener("click", (e) => { if (e.target === glDialog) glDialog.close(); });

  }

  function frameDiagram(D, variant, T) {
    const E = (s, d) => easeOutCubic(cl((T - s) / d, 0, 1)), Dr = (s, d) => easeInOutSine(cl((T - s) / d, 0, 1)), M = (s, d) => easeInOutCubic(cl((T - s) / d, 0, 1));
    const strong = variant === "strong", weak = variant === "weak";
    const reset = M(S6, 1.0);
    const env = E(S4 + 1.6, 1.0) * (1 - E(S4 + 10.3, 1.2));
    const j = env * 6 * Math.sin((T - S4) * Math.PI * 2 * 1.3);
    const vaL = Dr(S2 + 1.0, 1.0), vaR = Dr(S2 + 2.6, 1.0);
    const pIn = E(S2 + 1.8, 0.7), kIn = E(S2 + 3.4, 0.7);
    const ch1 = E(S2 + 4.0, 0.5), ch2 = E(S2 + 4.4, 0.5);
    const stP = E(S2 + 6.8, 0.35), stK = E(S2 + 7.5, 0.35);
    const pulse = 0.12 * Math.sin(Math.PI * Dr(S4 + 3.0, 0.9));
    const voterBrk = weak ? M(S5 + 5.6, 0.7) : 0;
    const courtIn = E(S3 + 0.2, 0.9);
    const courtBack = M(S4 + 0.2, 1.0) * (1 - reset);
    const drop = strong ? M(S5 + 2.8, 1.0) * (1 - reset) : 0;
    const cScale = lerp(1 - 0.25 * courtBack, 0.85, drop);
    const cOp = courtIn * lerp(1 - 0.65 * courtBack, 1, drop);
    const cDy = lerp(lerp(-60, 0, courtIn), 440 - 115, drop);
    const checkOp = cl(1 - M(S4 + 0.1, 0.7) + reset, 0, 1);
    const checkP = i => Dr(S3 + 1.6 + i * 1.2, 0.7);
    const reviewP = Dr(S3 + 7.6, 0.9);
    const tugP = Dr(S4 + 1.0, 1.0);
    const tugOp = (1 - reset) * (strong ? 1 - M(S5 + 3.6, 0.6) : 1);
    const tugBrk = weak ? M(S5 + 5.2, 0.7) : 0;
    const lockIn = E(S4 + 5.5, 0.5);
    const lockOpen = strong ? M(S5 + 2.0, 0.5) : 0;
    const lockOp = lockIn * (1 - reset) * (strong ? 1 - M(S5 + 2.6, 0.5) : 1);
    const army = weak ? E(S5 + 6.2, 1.2) : 0;
    const P = G.P, K = G.K, S = G.S;

    D.vlab.style.opacity = E(S1 + 1.6, 0.8);
    D.vline.style.transform = `scaleX(${Dr(S1 + 1.6, 1.4)})`;
    D.voters.forEach((el, i) => { const k = E(S1 + 1.8 + i * 0.035, 0.6); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 36}px)`; });

    D.court.style.opacity = cOp; D.court.style.transform = `translate(0px, ${cDy}px) scale(${cScale})`; D.court.style.zIndex = drop > 0 ? 3 : 1;
    D.pres.style.opacity = pIn; D.pres.style.transform = `translate(${j}px, ${(1 - pIn) * 50}px)`;
    D.cong.style.opacity = kIn; D.cong.style.transform = `translate(${j}px, ${(1 - kIn) * 50}px)`;
    const stampStyle = (el, p) => { el.style.opacity = p; el.style.display = p <= 0.001 ? "none" : ""; el.style.transform = `rotate(-9deg) scale(${lerp(1.9, 1, p) * (1 + pulse)})`; };
    stampStyle(D.stP, stP); stampStyle(D.stK, stK);
    D.ch.forEach((el, i) => { const k = i ? ch2 : ch1; el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 16}px)`; });

    D.arrows.innerHTML =
      arrow({ pts: [[530, 732], [530, 594]], p: vaL, color: C.voterLine, w: 7, brk: voterBrk }) +
      arrow({ pts: [[1360, 732], [1360, 604]], p: vaR, color: C.voterLine, w: 7, brk: voterBrk }) +
      CHECKS.map((c, i) => arrow({ pts: c.dir > 0 ? [[770, c.y], [1090, c.y]] : [[1090, c.y], [770, c.y]], p: checkP(i), op: checkOp, color: c.color, w: 5, head: 18 })).join("") +
      arrow({ pts: [[S.x, 115], [530, 115], [530, P.y - 8]], p: reviewP, op: checkOp, color: C.court, w: 5, head: 18 }) +
      arrow({ pts: [[S.x + S.w, 115], [1360, 115], [1360, K.y - 8]], p: reviewP, op: checkOp, color: C.court, w: 5, head: 18 }) +
      `<g transform="translate(${j} 0)">` +
      arrow({ pts: [[768, 420], [G.mid - 4, 420]], p: tugP, op: tugOp, color: C.pres, w: 16, head: 38, brk: tugBrk }) +
      arrow({ pts: [[1092, 420], [G.mid + 4, 420]], p: tugP, op: tugOp, color: C.cong, w: 16, head: 38, brk: tugBrk }) + `</g>`;

    D.clab.forEach((el, i) => { el.style.opacity = checkOp * E(S3 + 1.9 + i * 1.2, 0.5); });
    D.rlab.style.opacity = checkOp * E(S3 + 8.2, 0.5);

    D.lock.style.opacity = lockOp; D.lock.style.display = lockOp <= 0.001 ? "none" : "";
    D.lock.style.transform = `scale(${lerp(0.6, 1, lockIn)})`;
    D.shackle.setAttribute("transform", `translate(0 ${-14 * lockOpen}) rotate(${-22 * lockOpen} 74 58)`);

    D.army.style.opacity = army; D.army.style.display = army <= 0.001 ? "none" : "";
    D.army.style.transform = `translateX(${(1 - army) * 360}px)`;
    if (army > 0.001) D.sold.forEach((el, i) => { el.style.transform = `translateY(${-Math.abs(Math.sin((T - S5) * Math.PI * 2.4 + i * 0.6)) * 8 * (1 - army)}px)`; });
  }

  function frame(T) {
    if (!R) return;
    const E = (s, d) => easeOutCubic(cl((T - s) / d, 0, 1)), Dr = (s, d) => easeInOutSine(cl((T - s) / d, 0, 1)), M = (s, d) => easeInOutCubic(cl((T - s) / d, 0, 1));
    const cam = 1 + 0.035 * cl((T - S1) / (S5 - S1), 0, 1);
    const k1 = M(S5, 1.2), k2 = M(S6, 1.2);
    const s = lerp(lerp(cam, 0.52, k1), 0.2, k2);
    const tx = lerp(lerp(G.mid * (1 - cam), -4, k1), 40, k2);
    const ty = lerp(lerp(445 * (1 - cam), 169, k1), 30, k2);
    const rOp = E(S5 + 0.3, 0.8) * (1 - M(S6, 0.6));
    const un = M(S6, 0.8);
    const hL = E(S5 + 0.9, 0.6) * (1 - un), hR = E(S5 + 1.3, 0.6) * (1 - un);
    const gT = M(S5 + 4.0, 1.0) * (1 - un), rT = M(S5 + 6.8, 1.0) * (1 - un);
    const chL = E(S5 + 4.4, 0.5) * (1 - un), chR = E(S5 + 7.2, 0.5) * (1 - un);
    const div = Dr(S5 + 0.4, 0.8) * (1 - un);
    const tIn = E(S1 + 0.3, 0.9), tk = M(S2, 1.0), tOut = 1 - M(S5, 0.6);
    const ul = Dr(S1 + 4.9, 0.6);
    const c1 = E(S6 + 0.8, 0.7), c2 = E(S6 + 1.1, 0.7), sel1 = M(S6 + 3.0, 0.4), sel2 = M(S6 + 4.0, 0.4);

    R.gT.style.opacity = gT; R.rT.style.opacity = rT; R.div.style.transform = `scaleY(${div})`;
    R.frameA.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    frameDiagram(R.A, "strong", T);
    R.frameB.style.opacity = rOp; R.frameB.style.display = rOp <= 0.001 ? "none" : "";
    if (rOp > 0.001) { R.frameB.style.transform = `translate(${956 + (1 - k1) * 120}px, 169px) scale(0.52)`; frameDiagram(R.B, "weak", T); }
    const headOp = (el, op) => { el.style.opacity = op; el.style.transform = `translateY(${(1 - op) * 24}px)`; };
    headOp(R.hL, hL); headOp(R.hR, hR);
    const resOp = (el, op) => { el.style.opacity = op; el.style.transform = `translateY(${(1 - op) * 20}px)`; };
    resOp(R.chL, chL); resOp(R.chR, chR);
    R.title.style.opacity = tIn * tOut; R.title.style.display = tOut <= 0.001 ? "none" : "";
    R.title.style.left = lerp(960, 80, tk) + "px"; R.title.style.top = lerp(300, 66, tk) + "px";
    R.title.style.transform = `translate(${-(1 - tk) * 50}%, -50%) translateY(${(1 - tIn) * 70}px) scale(${lerp(1, 0.36, tk)})`;
    R.ul.style.transform = `scaleX(${ul * (1 - tk)})`;
    const cardOp = (el, op) => { el.style.opacity = op; el.style.display = op <= 0.001 ? "none" : ""; el.style.transform = `translateY(${(1 - op) * 60}px)`; };
    cardOp(R.c1, c1); cardOp(R.c2, c2);
    const chipSel = (el, sel) => { el.querySelector(".iv-chipbg").style.opacity = sel; el.style.color = mixHex(C.ink, "#FFFFFF", sel); };
    chipSel(R.sel1, sel1); chipSel(R.sel2, sel2);

    // Titulky: jeden prvek, nejvýš jeden viditelný, prolínání 0.18 s
    let active = null, end = Infinity;
    for (let i = 0; i < CAPS.length; i++) {
      if (T < CAPS[i].at) break;
      active = CAPS[i]; end = i + 1 < CAPS.length ? CAPS[i + 1].at : Infinity;
    }
    R.capText = (active && T < end) ? active.text : "";
    if (!active || T >= end) { R.cap.style.opacity = 0; }
    else {
      let o = Math.min(1, (T - active.at) / 0.18);
      if (isFinite(end)) o = Math.min(o, (end - T) / 0.18);
      R.cap.style.opacity = cl(o, 0, 1);
      if (R.cap.dataset.text !== active.text) { R.cap.dataset.text = active.text; R.cap.innerHTML = active.text; }
    }
  }

  // ---- Přehrávač ----
  let root, viewport, stage, bar, playBtn, track, fill, timeEl, sceneEl, skipBtn, capMobile;
  let time = 0, playing = false, raf = null, last = null, finished = false, onDone = null;

  function fit() {
    if (!viewport || !stage) return;
    // Na výšku (mobil) se scéna roztáhne na šířku a výška se dopočítá; jinak se vejde do okna
    const portrait = window.matchMedia("(max-width: 760px) and (orientation: portrait)").matches;
    let sc;
    if (portrait) { sc = viewport.clientWidth / 1920; viewport.style.height = Math.round(1080 * sc) + "px"; }
    else { viewport.style.height = ""; sc = Math.min(viewport.clientWidth / 1920, viewport.clientHeight / 1080); }
    stage.style.transform = `scale(${Math.max(0.05, sc)})`;
  }
  function fmtT(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, "0")}`; }
  function sceneName(t) { let name = ""; INTRO_SCENES.forEach(s => { if (t >= CUE[s.id]) name = s.name; }); return name; }
  function paint() {
    frame(time);
    fill.style.width = (time / total * 100) + "%";
    timeEl.textContent = `${fmtT(time)} / ${fmtT(total)}`;
    sceneEl.textContent = sceneName(time);
    if (capMobile && capMobile.dataset.text !== R.capText) { capMobile.dataset.text = R.capText; capMobile.innerHTML = R.capText; }
    playBtn.textContent = playing ? "⏸ Pauza" : (finished ? "↺ Znovu" : "▶ Přehrát");
    skipBtn.textContent = finished ? "Začít hru" : "Přeskočit úvod";
    skipBtn.classList.toggle("btn", finished); skipBtn.classList.toggle("btn-ghost", !finished);
  }
  function step(ts) {
    if (!playing) return;
    if (last == null) last = ts;
    time += (ts - last) / 1000; last = ts;
    if (time >= total) { time = total; playing = false; finished = true; last = null; }
    paint();
    if (playing) raf = requestAnimationFrame(step);
  }
  function play() { if (finished) { time = 0; finished = false; } playing = true; last = null; paint(); raf = requestAnimationFrame(step); }
  function pause() { playing = false; last = null; if (raf) cancelAnimationFrame(raf); paint(); }
  function seek(t) { time = cl(t, 0, total); finished = time >= total; if (finished) playing = false; paint(); }

  function onKey(e) {
    if (!root || root.hidden) return;
    if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === "ArrowLeft") seek(time - (e.shiftKey ? 5 : 1));
    else if (e.code === "ArrowRight") seek(time + (e.shiftKey ? 5 : 1));
    else if (e.key === "Escape") { done(); }
  }
  function done() { pause(); hide(); if (onDone) onDone(); }

  function build() {
    root = document.createElement("div");
    root.id = "intro"; root.setAttribute("role", "region"); root.setAttribute("aria-label", "Úvodní video");
    root.innerHTML = `<div class="iv-viewport"><div class="iv-stage">${stageHtml()}</div></div>
      <div class="iv-cap-mobile" aria-hidden="true"></div>
      <div class="iv-hint">Otoč telefon na šířku, video bude větší.</div>
      <div class="iv-bar">
        <button class="btn-ghost iv-play" aria-label="Přehrát nebo pozastavit">▶ Přehrát</button>
        <span class="iv-time"></span>
        <div class="iv-track" role="slider" aria-label="Pozice ve videu" tabindex="0" aria-valuemin="0" aria-valuemax="${total}"><span></span></div>
        <span class="iv-scene"></span>
        <button class="btn-ghost iv-skip">Přeskočit úvod</button>
      </div>`;
    document.body.appendChild(root);
    viewport = root.querySelector(".iv-viewport"); stage = root.querySelector(".iv-stage"); bar = root.querySelector(".iv-bar");
    playBtn = root.querySelector(".iv-play"); track = root.querySelector(".iv-track"); fill = track.firstElementChild;
    timeEl = root.querySelector(".iv-time"); sceneEl = root.querySelector(".iv-scene"); skipBtn = root.querySelector(".iv-skip");
    capMobile = root.querySelector(".iv-cap-mobile");
    R = refs(stage);
    playBtn.addEventListener("click", () => playing ? pause() : play());
    skipBtn.addEventListener("click", done);
    const seekFromEvent = e => { const r = track.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * total); };
    track.addEventListener("pointerdown", e => { seekFromEvent(e); const mv = ev => seekFromEvent(ev); const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); }; window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up); });
    window.addEventListener("resize", fit);
    document.addEventListener("keydown", onKey);
  }
  function hide() { if (root) root.hidden = true; }

  /** Spustí úvodní video. callback = co udělat po skončení nebo přeskočení. */
  function show(callback, autoplay = true) {
    onDone = callback;
    if (!root) build();
    root.hidden = false;
    fit();
    seek(0);
    if (autoplay) play(); else paint();
    skipBtn.focus();
  }

  return { show, hide, get total() { return total; } };
})();

/* ---------- Start ---------- */
(function init() {
  try {
    const th = localStorage.getItem("prez-theme");
    if (th) document.documentElement.setAttribute("data-theme", th);
    const odz = localStorage.getItem("prez-odznaky");
    if (odz) state.dokoncene = JSON.parse(odz) || {};
  } catch (e) {}
  render();
  // Úvodní video se přehraje automaticky; při prefers-reduced-motion se jen nabídne tlačítkem na úvodu.
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduced && !location.hash.includes("bezvidea")) Intro.show(() => go("uvod"));
})();
</script>
</body>
</html>
